---
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Matches the release workflow, which needs npm >= 11.5.1 for trusted
      # publishing. Keeping both on the same npm is what makes a green PR
      # evidence that the release will get that far too.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install workspaces
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Named explicitly because newer npm blocks install scripts by default, and
      # the claude CLI fetches its native binary from a postinstall. The version
      # check is the assertion: without it a blocked postinstall installs
      # "successfully" and only fails later, somewhere less obvious.
      - name: Install Claude Code CLI
        run: |
          npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code
          claude --version

      - name: Validate marketplace and plugin manifests
        run: pnpm validate

      - name: Check plugin and package versions agree
        run: pnpm check:versions

      # Packed per directory with npm rather than `pnpm pack -r`, to match how
      # publish-npm.mjs actually publishes, and because `pnpm pack -r` also packs
      # the private root.
      - name: Check each plugin packs cleanly
        run: |
          for plugin in plugins/*/; do
            npm pack --dry-run "$plugin"
          done
