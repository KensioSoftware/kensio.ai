name: Release

# Every merge to main is a candidate release. semantic-release reads the
# conventional-commit subjects since the last tag, decides the next version (or
# decides there is nothing to release), writes it into all eleven manifests, tags
# it, and opens a GitHub release.
#
# npm publishing is gated on the PUBLISH_NPM repository variable — see
# scripts/publish-npm.mjs.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two releases race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump, create the tag and the release
  issues: write # semantic-release comments on released issues
  pull-requests: write # and on released pull requests
  id-token: write # npm trusted publishing, and provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install workspaces
        run: npm ci

      # Newer npm blocks install scripts unless the package is named, and the
      # claude CLI fetches its native binary from a postinstall. Without this the
      # install "succeeds" and then every `claude` call fails, which is how the
      # first release run died. The version check turns that into a loud failure
      # at the point of cause.
      - name: Install Claude Code CLI
        run: |
          npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code
          claude --version

      # Never tag or publish something that would not have passed on a PR.
      - name: Check
        run: npm run check

      # v1.1.0 is tagged by hand as the baseline, marking the last state of the
      # repository under hand-managed versions. Every tag after it comes from
      # here. Without a tag to measure from, semantic-release would start again
      # at 1.0.0 and regress plugins already past it.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
