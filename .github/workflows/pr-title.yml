---
name: PR title

# Merges are squash-only and the squash title is the PR title, so the PR title is
# the commit message that lands on main — and therefore the string the release
# workflow derives the next version from. Linting it here is what keeps automatic
# semver honest.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # feat -> minor, fix/perf -> patch, anything with a ! or a
          # BREAKING CHANGE footer -> major. The rest release nothing.
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter and not end with a full stop.
